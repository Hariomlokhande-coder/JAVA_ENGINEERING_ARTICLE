# Local development profile: file based H2 instead of PostgreSQL.
# Start it with:  mvn spring-boot:run "-Dspring-boot.run.profiles=dev"
# The data lives in backend/data/technical-blog.mv.db and survives restarts.
spring:
  datasource:
    url: jdbc:h2:file:./data/technical-blog;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect

logging:
  level:
    com.technicalblog: INFO
