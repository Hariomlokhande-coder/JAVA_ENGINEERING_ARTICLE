<header class="site-header">
  <div class="container header-inner">
    <a class="brand" routerLink="/" (click)="closeMenu()">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 6 3 12l5 6" />
          <path d="m16 6 5 6-5 6" />
        </svg>
      </span>
      <span class="brand-text">Technical<span class="brand-accent">Blog</span></span>
    </a>

    <button type="button" class="menu-toggle" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()">
      <span class="sr-only">Toggle navigation</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true">
        @if (menuOpen()) {
          <path d="M18 6 6 18M6 6l12 12" />
        } @else {
          <path d="M3 6h18M3 12h18M3 18h18" />
        }
      </svg>
    </button>

    <div class="header-actions" [class.open]="menuOpen()">
      <form class="search-box" (ngSubmit)="search()" role="search">
        <svg class="search-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7" />
          <path d="m20 20-3.5-3.5" />
        </svg>
        <input
          #searchInput
          type="search"
          name="keyword"
          placeholder="Search articles"
          aria-label="Search articles"
          [ngModel]="keyword()"
          (ngModelChange)="keyword.set($event)"
        />
        <kbd class="search-hint" aria-hidden="true">/</kbd>
      </form>

      <nav class="nav-links">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">
          Roadmap
        </a>

        @if (isAdmin()) {
          <!-- Only the site owner sees the builder tools -->
          <a routerLink="/admin/dashboard" routerLinkActive="active" (click)="closeMenu()">Dashboard</a>
        }

        @if (isLoggedIn()) {
          <span class="who" [attr.title]="username()">{{ username() }}</span>
          <button type="button" class="nav-button" (click)="logout()">Sign out</button>
        } @else {
          <a routerLink="/login" routerLinkActive="active" (click)="closeMenu()">Sign in</a>
          <a class="btn btn-sm signup" routerLink="/register" (click)="closeMenu()">Sign up</a>
        }

        <button
          type="button"
          class="theme-toggle"
          (click)="toggleTheme()"
          [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
        >
          @if (theme() === 'dark') {
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4.2" />
              <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
            </svg>
          } @else {
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
            </svg>
          }
        </button>
      </nav>
    </div>
  </div>
</header>
