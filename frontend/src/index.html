<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Technical Blog</title>
  <base href="/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A growing collection of everything I learn - Java, Spring Boot, backend development, databases and system design.">
  <!-- Shown when a link is shared on WhatsApp, LinkedIn, X and similar -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Technical Blog">
  <meta property="og:title" content="Technical Blog">
  <meta property="og:description" content="A growing collection of everything I learn - Java, Spring Boot, backend development, databases and system design.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Technical Blog">
  <meta name="twitter:description" content="A growing collection of everything I learn - Java, Spring Boot, backend development, databases and system design.">

  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#020817" media="(prefers-color-scheme: dark)">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <script>
    // Applies the stored theme before first paint so the page never flashes white.
    (function () {
      try {
        var stored = localStorage.getItem('technical-blog.theme');
        document.documentElement.setAttribute('data-theme', stored === 'dark' ? 'dark' : 'light');
      } catch (error) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
